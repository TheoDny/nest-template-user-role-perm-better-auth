services:
    postgres:
        image: postgres:16-alpine
        container_name: nestjs_better_auth_postgres
        restart: unless-stopped
        # ports:
        #     - "5432:5432"
        environment:
            POSTGRES_DB: nest_urp
            POSTGRES_USER: nest_urp
            POSTGRES_PASSWORD: ${DATABASE_PASSWORD}
        volumes:
            - postgres_data:/var/lib/postgresql/data
        healthcheck:
            test: ["CMD-SHELL", "pg_isready -U nest_urp -d nest_urp"]
            interval: 1m
            timeout: 10s
            retries: 5

    # mailpit:
    #     image: axllent/mailpit:latest
    #     container_name: nestjs_better_auth_mailpit
    #     restart: unless-stopped
    #     ports:
    #         - "1025:1025"
    #         - "8025:8025"

    migrate:
        build:
            context: .
            target: migration
        container_name: nestjs_better_auth_migrate
        restart: "no"
        environment:
            NODE_ENV: production
            DATABASE_URL: ${DATABASE_URL}
        depends_on:
            postgres:
                condition: service_healthy

    api:
        build:
            context: .
            target: production
        container_name: nestjs_better_auth_api
        restart: unless-stopped
        ports:
            - "${PORT_HOST:-3000}:${PORT:-3000}"
        environment:
            NODE_ENV: production
            PORT: ${PORT:-3000}
            DATABASE_URL: ${DATABASE_URL}
            BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET}
            BETTER_AUTH_URL: ${BETTER_AUTH_URL}
            BETTER_AUTH_BASE_PATH: ${BETTER_AUTH_BASE_PATH}
            BETTER_AUTH_TRUSTED_ORIGINS: ${BETTER_AUTH_TRUSTED_ORIGINS}
            APP_PUBLIC_URL: ${APP_PUBLIC_URL}
            SMTP_HOST: ${SMTP_HOST}
            SMTP_PORT: ${SMTP_PORT}
            SMTP_USER: ${SMTP_USER}
            SMTP_PASSWORD: ${SMTP_PASSWORD}
            SMTP_FROM: ${SMTP_FROM}
        healthcheck:
            test:
                [
                    "CMD",
                    "node",
                    "-e",
                    "fetch('http://127.0.0.1:' + (process.env.PORT || 3000) + '/status').then((response) => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))",
                ]
            interval: 1m
            timeout: 10s
            retries: 3
            start_period: 30s
        depends_on:
            migrate:
                condition: service_completed_successfully
            postgres:
                condition: service_healthy

volumes:
    postgres_data:
